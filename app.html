<title>MUSE GANTT</title>
<style>
/* Layout: one screen — slim date bar, full-bleed gantt ruled like a process sheet (every row and day has its line), tab bar; details float as centered cards */
:root{
  --bg:#E8E4DC; --surface:#FAF8F4; --surface-2:#F0EDE7; --surface-3:#E4E0D8;
  --ink:#1E211F; --ink-2:#585B56; --ink-3:#8C8B84;
  --line:rgba(30,33,31,.075); --line-2:rgba(30,33,31,.15); --line-3:rgba(30,33,31,.30);
  --green:#1F4B3D; --green-mid:#3D7562; --green-soft:#D2DFD7; --on-green:#F6F4EE;
  --brass:#946512; --brass-soft:#F0E1C2;
  --late:#B23A26; --late-soft:#F4D8D0;
  --done:#A3A19A; --done-soft:#E3E0D9;
  --priv:#4F5E6E; --priv-soft:#D6DCE3;
  --master:#2B2F2D; --master-soft:#D9D6CF;
  --off:rgba(30,33,31,.045); --wkend:rgba(30,33,31,.055); --today:rgba(31,75,61,.085); --grp-tint:rgba(30,33,31,.04); --pink:rgba(226,112,136,.15); --pink-ink:#C24E68;
  --scrim:rgba(16,18,17,.40); --shadow:0 22px 60px rgba(16,20,18,.28),0 2px 8px rgba(16,20,18,.10);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --row:38px; --axis:30px; --fs:10px; --nw:120px; --kb:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101211; --surface:#181B1A; --surface-2:#202423; --surface-3:#2A2F2D;
  --ink:#ECEAE4; --ink-2:#A8A9A3; --ink-3:#71736E;
  --line:rgba(236,234,228,.07); --line-2:rgba(236,234,228,.14); --line-3:rgba(236,234,228,.28);
  --green:#5DAA8C; --green-mid:#3E7D66; --green-soft:#21402F; --on-green:#0D1411;
  --brass:#D9A954; --brass-soft:#45391F; --late:#EA6E55; --late-soft:#4D261F;
  --done:#62655F; --done-soft:#2B2E2C; --priv:#9AAABB; --priv-soft:#2C3642;
  --master:#DDDAD3; --master-soft:#3A3D3B;
  --off:rgba(0,0,0,.26); --wkend:rgba(255,255,255,.03); --today:rgba(93,170,140,.11); --grp-tint:rgba(255,255,255,.035); --pink:rgba(232,128,150,.16); --pink-ink:#E88AA0;
  --scrim:rgba(0,0,0,.6); --shadow:0 22px 60px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101211; --surface:#181B1A; --surface-2:#202423; --surface-3:#2A2F2D;
  --ink:#ECEAE4; --ink-2:#A8A9A3; --ink-3:#71736E;
  --line:rgba(236,234,228,.07); --line-2:rgba(236,234,228,.14); --line-3:rgba(236,234,228,.28);
  --green:#5DAA8C; --green-mid:#3E7D66; --green-soft:#21402F; --on-green:#0D1411;
  --brass:#D9A954; --brass-soft:#45391F; --late:#EA6E55; --late-soft:#4D261F;
  --done:#62655F; --done-soft:#2B2E2C; --priv:#9AAABB; --priv-soft:#2C3642;
  --master:#DDDAD3; --master-soft:#3A3D3B;
  --off:rgba(0,0,0,.26); --wkend:rgba(255,255,255,.03); --today:rgba(93,170,140,.11); --grp-tint:rgba(255,255,255,.035); --pink:rgba(232,128,150,.16); --pink-ink:#E88AA0;
  --scrim:rgba(0,0,0,.6); --shadow:0 22px 60px rgba(0,0,0,.6); color-scheme:dark}

/* manipulation: no double-tap zoom (and no tap delay waiting for one) */
html{box-sizing:border-box;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.35 var(--font);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-variant-numeric:tabular-nums;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid var(--green);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);-webkit-user-select:text;user-select:text}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}

/* ---- top bar: date + period ---- */
.top{display:flex;align-items:center;gap:2px;height:50px;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-arrow{width:32px;height:44px;flex:none;display:grid;place-items:center;color:var(--ink-2);border-radius:10px}
.nav-arrow .ic{width:20px;height:20px}
.datebox{position:relative;display:flex;flex-direction:column;justify-content:center;flex:1;min-width:0;height:44px;padding:0 2px}
.datebox b{font-size:15px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox small{font-size:var(--fs);color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:5px;font-weight:600}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.sync{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.sync.saved{background:var(--green)} .sync.saving{background:var(--brass);animation:pulse 1s infinite} .sync.error{background:var(--late)}
.sync.local{background:transparent;box-shadow:inset 0 0 0 1.2px var(--ink-3)}
@keyframes pulse{50%{opacity:.35}}
.seg{display:flex;flex:none;background:var(--surface-3);border-radius:10px;padding:2px;height:34px}
.seg button{min-width:34px;padding:0 7px;font-size:12px;font-weight:700;color:var(--ink-2);border-radius:8px;height:30px;position:relative;white-space:nowrap}
.seg button::before{content:"";position:absolute;inset:-6px 0}
.seg button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---- chart ---- */
.chart{position:relative;min-height:0;background:var(--surface);border-top:1px solid var(--line-3);border-bottom:1px solid var(--line-3)}
.scroller{position:absolute;inset:0;overflow:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.g{position:relative}
.axis{position:sticky;top:0;z-index:6;display:flex;height:var(--axis);background:var(--surface);border-bottom:1px solid var(--line-3)}
.corner{position:sticky;left:0;z-index:7;width:var(--nw);flex:none;background:var(--surface);border-right:1px solid var(--line-3);display:flex;align-items:center;gap:4px;padding-left:max(6px,env(safe-area-inset-left,0px))}
.chip-s{height:22px;padding:0 8px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);font-size:var(--fs);font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:3px;position:relative;white-space:nowrap}
.chip-s::before{content:"";position:absolute;inset:-8px -3px}
.chip-s[aria-pressed=true]{background:var(--ink);color:var(--surface);box-shadow:none}
.corner.stack{flex-direction:column;align-items:flex-start;justify-content:center;gap:3px}
.corner.stack{gap:2px}
.corner.stack .mseg,.corner.stack .chip-s{height:17px}
.mseg{display:flex;height:24px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);padding:2px;position:relative}
.mseg::before{content:"";position:absolute;inset:-8px -2px}
.mseg button{position:relative;min-width:24px;padding:0 6px;border-radius:10px;font-size:10.5px;font-weight:800;color:var(--ink-2)}
.mseg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.ticks{position:relative;flex:none;height:100%;overflow:hidden}
.tk{position:absolute;top:0;height:100%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs);font-weight:600;color:var(--ink-2);white-space:nowrap;line-height:1.05}
.tk i{display:block;font-style:normal;font-size:var(--fs);font-weight:600;color:var(--ink-3);margin-top:1px}
.tk.sun,.tk.hol,.tk.sun i,.tk.hol i{color:var(--late)} .tk.sat,.tk.sat i{color:var(--priv)}
.tk.tdy,.tk.tdy i{color:var(--pink-ink);font-weight:800}
.ticks .hf{position:absolute;top:0;bottom:0;background:var(--pink);box-shadow:inset 0 -2px 0 var(--pink-ink)}
.tl{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--line-2)} .tl.w{border-left-color:var(--line-3)} .tl.tick{top:auto;height:5px;border-left-color:var(--line)}
.mb{position:absolute;top:0;height:19px;box-shadow:inset 0 -1px 0 transparent;border-left:1.5px solid var(--ink-3);font-size:var(--fs);font-weight:800;line-height:18px;padding-left:5px;white-space:nowrap;overflow:hidden;color:var(--ink)}
.mb::after{content:"";position:absolute;left:0;right:0;top:19px;border-top:1px solid var(--line-3)}
.mb.alt{background:var(--wkend)} .mb.first{border-left:0}
.mb.one{line-height:38px;text-align:center;padding:0}
.mb.one::after{display:none}
.mb.one.cur{color:var(--green)}
.tk.wk{top:19px;height:auto;bottom:0}
.tl.lo{top:19px}
.nowp{position:absolute;top:7px;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:var(--fs);font-weight:700;padding:2px 6px;border-radius:7px;z-index:2}
.body{position:relative}
.bg{position:absolute;top:0;bottom:0;left:var(--nw);pointer-events:none;overflow:hidden}
.bg i{position:absolute;top:0;bottom:0;display:block}
.bg .gl{width:0;border-left:1px solid var(--line)} .bg .gl.h{border-left-color:var(--line-2)} .bg .gl.w{border-left-color:var(--line-3)}
.bg .mz{background:var(--wkend)} .bg .gl.m{border-left:1.5px solid var(--ink-3)}
.tl.m{border-left:1.5px solid var(--ink-3)}
.bg .off{background:var(--off)} .bg .wk{background:var(--wkend)} .bg .td,.bg .cm{background:var(--pink)}
.bg .now{width:0;border-left:2px solid var(--late);z-index:1}
.bg .now::before{content:"";position:absolute;top:-1px;left:-5px;width:8px;height:8px;border-radius:50%;background:var(--late)}
.row{display:flex;height:var(--row);position:relative}
.nm{position:sticky;left:0;z-index:4;width:var(--nw);flex:none;background:var(--surface);border-right:1px solid var(--line-3);border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:4px;padding:0 6px 0 max(2px,env(safe-area-inset-left,0px));min-width:0}
.row.sel .nm{background:var(--surface-2)}
.row.sel .nm::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 2px 2px 0;background:var(--ink)}
.row.sel .trk{background:var(--today)}
.nt{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px}
.nt b{font-size:var(--fs);font-weight:700;line-height:1.15;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;word-break:break-word;letter-spacing:-.01em}
.nt small{font-size:var(--fs);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:clip;font-weight:500;line-height:1.2}
.nt small.late{color:var(--late);font-weight:700} .nt small.run{color:var(--green);font-weight:700} .nt small.warn{color:var(--brass);font-weight:700} .nt small.gh{color:var(--green)}
.ck{width:18px;height:var(--row);display:grid;place-items:center;flex:none}
.ck::after{content:"";width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--ink-3);grid-area:1/1}
.ck svg{grid-area:1/1;width:8px;height:8px;stroke:var(--surface);stroke-width:2.8;fill:none;opacity:0;z-index:1}
.ck.s-doing::after{box-shadow:inset 0 0 0 1.6px var(--green);background:radial-gradient(circle,var(--green) 0 4px,transparent 4.5px)}
.ck.s-paused::after{box-shadow:inset 0 0 0 1.6px var(--brass)}
.ck.late::after{box-shadow:inset 0 0 0 1.6px var(--late)}
.ck.s-done::after{background:var(--done);box-shadow:none}
.ck.s-done svg{opacity:1}
.ck.gh{color:var(--green);font-size:13px} .ck.gh::after{display:none}
.ck.mst::after{border-radius:4px}
.trk{position:relative;flex:none;border-bottom:1px solid var(--line-2);overflow-x:clip}
.bar{--c:var(--green);--t:var(--green-soft);position:absolute;top:calc((var(--row) - 24px) / 2);height:24px;border-radius:7px;background:var(--t);color:var(--c);box-shadow:inset 0 0 0 1.5px var(--c);overflow:visible;z-index:2;transition:box-shadow .15s,transform .15s}
.bar .pg{position:absolute;left:0;top:0;bottom:0;border-radius:7px 0 0 7px;background:var(--c);display:block;max-width:100%}
.bar .pg.full{border-radius:7px}
.bar .bl{position:absolute;top:0;line-height:24px;font-size:var(--fs);font-weight:700;color:var(--c);white-space:nowrap;pointer-events:none}
.bar .bl.on{color:var(--surface)}
.b-imp{--c:var(--brass);--t:var(--brass-soft)}
.b-late{--c:var(--late);--t:var(--late-soft)}
.b-done{--c:var(--done);--t:var(--done-soft)}
.b-priv{--c:var(--priv);--t:var(--priv-soft)}
.b-mst{--c:var(--master);--t:var(--master-soft)}
.b-ghost{--c:var(--green);background:transparent;box-shadow:none;border:1.5px dashed var(--green);border-radius:7px}
.b-ghost .bl{color:var(--green);left:5px}
.bar.sel{box-shadow:inset 0 0 0 1.5px var(--c),0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.bar.lift{box-shadow:var(--shadow),0 0 0 2px var(--ink);transform:scaleY(1.1);z-index:8;transition:none}
.bar.run::after{content:"";position:absolute;right:-4px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--surface);animation:pulse 1.4s infinite}
.hd{position:absolute;top:-9px;bottom:-9px;width:28px;touch-action:none;z-index:3;display:grid;place-items:center}
.hd.l{left:-15px} .hd.r{right:-15px}
/* short bars keep their middle free for moving: handles sit just outside */
.bar.narrow::before{content:"";position:absolute;inset:-6px -7px}
.bar.narrow .hd{width:22px} .bar.narrow .hd.l{left:-24px} .bar.narrow .hd.r{right:-24px}
.hd::after{content:"";width:7px;height:20px;border-radius:4px;background:var(--surface);box-shadow:0 0 0 1.6px var(--ink)}
.ms{position:absolute;top:calc(var(--row) / 2 - 6px);width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:var(--green);border-radius:2px;z-index:2}
.ms.b-imp{background:var(--brass)} .ms.b-late{background:var(--late)} .ms.b-done{background:var(--done)} .ms.b-mst{background:var(--master)} .ms.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.act{position:absolute;bottom:2px;height:4px;border-radius:2px;background:var(--ink);opacity:.7;z-index:1}
.act.live{background:var(--green);opacity:1}
.dl{position:absolute;top:5px;bottom:5px;width:0;border-left:2px solid var(--late);z-index:3}
.dl::before{content:"";position:absolute;top:0;left:0;border-left:8px solid var(--late);border-bottom:6px solid transparent}
/* group rows stay see-through over the track so the day/week lines run unbroken from top to bottom */
.grp{display:flex;min-height:30px;position:relative;border-bottom:1px solid var(--line-2)}
.gn{position:sticky;left:0;z-index:4;width:var(--nw);flex:none;background:var(--surface-2);border-right:1px solid var(--line-3);display:flex;align-items:center;gap:4px;padding:4px 6px 4px max(4px,env(safe-area-inset-left,0px))}
.gn b{font-size:var(--fs);font-weight:750;line-height:1.2;color:var(--ink);word-break:break-word;min-width:0}
.gn b small{font-size:var(--fs);color:var(--ink-2);white-space:nowrap;font-weight:600;margin-left:4px}
.gn .ic{width:14px;height:14px;stroke-width:2.4;color:var(--ink-2);transition:transform .2s}
.grp.col .gn .ic{transform:rotate(-90deg)}
.gt{position:absolute;top:0;bottom:0;left:var(--nw);background:var(--grp-tint)}
.span{position:absolute;top:11px;height:8px;border-radius:4px;background:var(--line-3)}
.deps{position:absolute;top:0;left:var(--nw);pointer-events:none;overflow:visible;z-index:2}
.deps path{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}
.nfill{position:sticky;left:0;top:0;width:var(--nw);height:0;z-index:3}
.nfill::before{content:"";position:absolute;left:0;top:0;width:100%;height:var(--bodyh,100%);background:var(--surface);border-right:1px solid var(--line-3)}
.empty{position:absolute;left:var(--nw);right:0;top:26%;text-align:center;text-wrap:balance;color:var(--ink-2);font-size:var(--fs);line-height:1.7;pointer-events:none;padding:0 16px}
.empty b{display:block;font-size:12px;color:var(--ink);font-weight:700}
.empty .btn{pointer-events:auto;margin-top:10px}
.tip{position:fixed;z-index:50;transform:translate(-50%,-50%);font-size:15px!important;padding:9px 14px!important;border-radius:12px!important;box-shadow:0 6px 20px rgba(0,0,0,.18);background:var(--ink);color:var(--surface);font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:9px;pointer-events:none;white-space:nowrap;display:none}
.tip.warn{background:var(--late);color:#fff}

/* ---- tab bar ---- */
.nav{display:grid;grid-template-columns:repeat(5,1fr);height:56px;align-items:center;padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.nav>button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:50px;font-size:10px;font-weight:700;color:var(--ink-2)}
.nav>button .ic{width:22px;height:22px}
.nav .add{display:grid;place-items:center;width:56px;height:40px;border-radius:13px;background:var(--ink);color:var(--surface)}
.nav .add .ic{width:22px;height:22px;stroke-width:2.3}
.nav #museBtn{color:var(--green)}
.nav #museBtn .ic{fill:currentColor;stroke:none}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brass);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
#museBtn.alert::after{content:"";position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--late);box-shadow:0 0 0 2px var(--bg)}

/* ---- centered card (details, add, MUSE, lists) ---- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.pop{position:fixed;z-index:41;left:50%;
  top:calc(env(safe-area-inset-top,0px) + (100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - var(--kb)) / 2);
  width:min(calc(100% - 24px),440px);max-height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - var(--kb) - 20px);
  transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;transition:opacity .16s ease,transform .2s cubic-bezier(.2,.9,.3,1);
  background:var(--surface-2);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.pop.open{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
/* full-screen page (list, MUSE, details, settings…): sits under the date bar area down to the tab bar */
.pop[data-size=page]{left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 50px);bottom:calc(54px + env(safe-area-inset-bottom,0px));width:auto;max-height:none;border-radius:0;box-shadow:none;
  border-top:1px solid var(--line-3);background:var(--bg);transform:translateX(24px);border-bottom:1px solid var(--line-3)}
.pop[data-size=page]{transform:none;transition:opacity .12s ease} .pop[data-size=page].open{transform:none}
.pop[data-size=page] .sc{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pop[data-size=page] .dh{background:var(--bg);margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.pop[data-size=page] .sc.chat{background:var(--surface)}
.pop[data-size=page] .mh{background:var(--bg)}
.nav>button.on{color:var(--ink)}
.nav>button.on::after{content:"";position:absolute;bottom:1px;left:calc(50% - 10px);width:20px;height:3px;border-radius:2px;background:var(--ink)}
.nav #museBtn.on{color:var(--green)} .nav #museBtn.on::after{background:var(--green)}
.bar.mlab .pg{opacity:.2}
.bar .bl.nmi{left:7px;right:7px;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:700}
.bar .bl.out{color:var(--ink);font-weight:700}

<script>
'use strict';
/* ============ basics ============ */
const MIN=60000, HOUR=3600000, DAY=86400000;
const DOW=['日','月','火','水','木','金','土'];
const KINDS={
  desk:{label:'通常業務'}, line:{label:'工程調整・改造'}, stop:{label:'設備停止'},
  witness:{label:'工程立ち会い'}, holiday:{label:'休日作業'}, private:{label:'プライベート'}
};
const DEFAULT_SETTINGS={workStart:'08:30',workEnd:'17:30',breaks:[{s:'10:15',e:'11:00',label:'製造部門休憩'}],holidays:[],lineRule:true,yearStart:4,days:{},lunch:60};
const TRACKED=['name','project','kind','scale','start','end','deadline','important','priority','status','progress','deps','memo','assignee','milestone'];
const $=(s,el=document)=>el.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const hm2min=s=>{const [h,m]=String(s||'0:0').split(':').map(Number);return (h||0)*60+(m||0)};
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const addDays=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()};
const atMin=(day,min)=>{const d=new Date(day);d.setHours(0,min,0,0);return d.getTime()};
const ymd=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fHM=t=>{const d=new Date(t);return `${d.getHours()}:${pad(d.getMinutes())}`};
const fMD=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()}`};
const fMDW=t=>`${fMD(t)}(${DOW[new Date(t).getDay()]})`;
const fISO=t=>{const d=new Date(t);return `${ymd(t)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dtl=t=>{const d=new Date(t);return `${ymd(t)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fDur=ms=>{const m=Math.round(ms/MIN);if(m<60)return m+'分';const h=Math.floor(m/60),r=m%60;return r?`${h}時間${r}分`:`${h}時間`};
const monday=t=>{const d=new Date(sod(t));return addDays(d.getTime(),-((d.getDay()+6)%7))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ceilTo=(t,u)=>Math.ceil(t/u)*u;
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ICON={
  check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  chev:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
  x:'<svg class="ic" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  l:'<svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  r:'<svg class="ic" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  plus:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg>',
  minus:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 12h12"/></svg>',
  trash:'<svg class="ic" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12M10 11v5M14 11v5"/></svg>'
};
const XBTN='<button class="xbtn" data-act="close" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>';
const MASTER_WEEKS=13;
const BASE_FONT='-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif';
const FONTS={
  system:{label:'標準（ヒラギノ）'},
  biz:{label:'BIZ UD ゴシック',g:'BIZ+UDPGothic:wght@400;700',fam:"'BIZ UDPGothic'"},
  maru:{label:'丸ゴシック',g:'Zen+Maru+Gothic:wght@500;700',fam:"'Zen Maru Gothic'"},
  mplus:{label:'M PLUS 1p',g:'M+PLUS+1p:wght@400;700',fam:"'M PLUS 1p'"},
  kaku:{label:'Noto Sans',g:'Noto+Sans+JP:wght@400;700',fam:"'Noto Sans JP'"},
  mincho:{label:'明朝',g:'Shippori+Mincho:wght@500;700',fam:"'Shippori Mincho'"},
  kiwi:{label:'手書き風',g:'Kiwi+Maru:wght@400;500',fam:"'Kiwi Maru'"}
};
const FSIZES={xs:{label:'極小',fs:8.5,row:32},s:{label:'小',fs:9,row:34},m:{label:'中',fs:10,row:38},l:{label:'大',fs:11.5,row:44},xl:{label:'特大',fs:13,row:50}};
function loadFont(k){const f=FONTS[k];if(!f||!f.g||document.getElementById('gf-'+k))return;const l=document.createElement('link');l.id='gf-'+k;l.rel='stylesheet';l.href=`https://fonts.googleapis.com/css2?family=${f.g}&display=swap`;document.head.appendChild(l)}
let fontKey='';
function applyFont(){
  const k=FONTS[S.settings.font]?S.settings.font:'system',z=FSIZES[S.settings.fsize]||FSIZES.m,key=k+z.fs;
  if(key===fontKey)return;fontKey=key;loadFont(k);
  const r=document.documentElement.style;r.setProperty('--font',(FONTS[k].fam?FONTS[k].fam+',':'')+BASE_FONT);r.setProperty('--fs',z.fs+'px');r.setProperty('--row',z.row+'px');
}
function parseDT(s){
  if(s==null||s==='')return null;
  if(typeof s==='number')return s;
  const m=String(s).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3],m[4]!=null?+m[4]:0,m[5]!=null?+m[5]:0).getTime();
  const t=Date.parse(s);return isNaN(t)?null:t;
}
const LS={
  get(k,d){try{const v=localStorage.getItem('muse.'+k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem('muse.'+k,JSON.stringify(v))}catch{}}
};

/* ============ state ============ */
const S={
  tasks:new Map(), proposals:new Map(), settings:clone(DEFAULT_SETTINGS), attendance:{},
  view:'day', anchor:sod(Date.now()), zoom:1, selected:null, scope:'all', mscale:'month', showDaily:!!LS.get('showDaily',false),
  collapsed:new Set(LS.get('collapsed',[])), dirty:new Map(), undo:null, nw:112, sync:'local', mode:'local'
};
function normTask(o){
  const t={
    id:String(o.id||uid()), name:String(o.name||'無題').slice(0,80), project:String(o.project||'未分類').slice(0,40),
    kind:KINDS[o.kind]?o.kind:'desk', start:+o.start, end:+o.end,
    deadline:o.deadline?+o.deadline:null, milestone:!!o.milestone, scale:o.scale==='week'?'week':'time', important:!!o.important,
    priority:['high','mid','low'].includes(o.priority)?o.priority:'mid',
    status:['todo','doing','paused','done'].includes(o.status)?o.status:'todo',
    progress:clamp(Math.round(+o.progress||0),0,100),
    segs:Array.isArray(o.segs)?o.segs.filter(s=>s&&s.s).map(s=>({s:+s.s,e:s.e?+s.e:null})):[],
    deps:Array.isArray(o.deps)?o.deps.map(String):[], memo:String(o.memo||''), assignee:String(o.assignee||''),
    sample:!!o.sample, history:Array.isArray(o.history)?o.history.slice(-40):[],
    createdAt:+o.createdAt||Date.now(), updatedAt:+o.updatedAt||Date.now(), rev:+o.rev||0, pendingSync:!!o.pendingSync
  };
  if(!isFinite(t.start))t.start=ceilTo(Date.now(),15*MIN);
  if(!(t.end>t.start))t.end=t.start+HOUR;
  // 大日程 items live on whole weeks (Monday 0:00 → Monday 0:00)
  if(t.scale==='week'){t.start=monday(t.start);t.end=Math.max(addDays(t.start,7),addDays(monday(t.end-1),7))}
  return t;
}
const isHoliday=t=>{const g=new Date(t).getDay();return g===0||g===6||S.settings.holidays.includes(ymd(t))};
const isLate=(t,now=Date.now())=>!t.ghost&&t.status!=='done'&&(now>t.end||(!!t.deadline&&t.end>t.deadline));
const scopeOk=t=>S.scope==='all'||(S.scope==='private')===(t.kind==='private');
const singleDay=(s,e)=>sod(s)===sod(e-1);
const isMaster=t=>t&&t.scale==='week';
const weeksOf=t=>Math.max(1,Math.round((t.end-t.start)/(7*DAY)));
function isoWeek(t){const d=new Date(sod(t));d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/DAY-3+((w1.getDay()+6)%7))/7)}
function isoWeekMonday(year,w){return addDays(monday(new Date(year,0,4).getTime()),(w-1)*7)}
const wLabel=t=>'W'+isoWeek(t);
const masterRange=t=>`${fMD(t.start)}〜${fMD(t.end-1)}`;
function barState(t,now){
  if(t.ghost)return 'ghost';
  if(t.status==='done')return 'done';
  if(isLate(t,now))return 'late';
  if(t.kind==='private')return 'priv';
  if(t.important||t.priority==='high')return 'imp';
  if(isMaster(t))return 'mst';
  return 'norm';
}
function workedMs(t,now=Date.now()){return t.segs.reduce((a,s)=>a+((s.e||now)-s.s),0)}

/* ============ constraints & scheduling (pure, shared by chart / quick add / MUSE) ============ */
// per-day marks (S.settings.days['YYYY-MM-DD']): off=休み, sub=振替休日 (on workdays); hw=休日出勤, sw=振替出勤 (on holidays)
const MARKS={off:{label:'休み',short:'休み'},sub:{label:'振替休日',short:'振休'},hw:{label:'休日出勤',short:'休出'},sw:{label:'振替出勤',short:'振出'}};
const dayMark=t=>(S.settings.days||{})[ymd(t)]||null;
const isOffDay=t=>{const m=dayMark(t);return m==='off'||m==='sub'||(isHoliday(t)&&m!=='hw'&&m!=='sw')};
const dayLabel=(t,short)=>{const m=dayMark(t);return m?MARKS[m][short?'short':'label']:isHoliday(t)?'休日':'平日'};
// 振替: every 振替出勤 needs one 振替休日 (paired in date order)
function furikae(){
  const d=S.settings.days||{},ks=Object.keys(d).sort(),sw=ks.filter(k=>d[k]==='sw'),sub=ks.filter(k=>d[k]==='sub');
  return {sw,sub,pairs:sw.map((k,i)=>({sw:k,sub:sub[i]||null})),extra:sub.slice(sw.length),need:Math.max(0,sw.length-sub.length),over:Math.max(0,sub.length-sw.length)};
}
function furikaeHTML(){
  const f=furikae();if(!f.sw.length&&!f.sub.length)return '<p class="hint" style="margin-top:0">振替出勤・振替休日の登録はありません</p>';
  const st=f.need?`<span class="fk-ng">振替休日があと${f.need}日足りません</span>`:f.over?`<span class="fk-ng">振替出勤のない振替休日が${f.over}日</span>`:'<span class="fk-ok">釣り合っています</span>';
  const rows=f.pairs.slice(-4).map(p=>`<div class="f"><span class="wide">${fMDW(parseDT(p.sw))} 振替出勤 → ${p.sub?fMDW(parseDT(p.sub))+' 振替休日':'<span class="fk-ng">未取得</span>'}</span></div>`).join('')
    +f.extra.map(k=>`<div class="f"><span class="wide">${fMDW(parseDT(k))} 振替休日 → <span class="fk-ng">対応する振替出勤なし</span></span></div>`).join('');
  return `<div class="fg"><div class="f"><span class="wide">振替出勤 ${f.sw.length}日 / 振替休日 ${f.sub.length}日</span>${st}</div>${rows}</div>`;
}
function allowedWindows(kind,day){
  const st=S.settings, ws=hm2min(st.workStart), we=hm2min(st.workEnd), hol=isHoliday(day), m=dayMark(day);
  const off=m==='off'||m==='sub', hwork=hol&&(m==='hw'||m==='sw');
  const W=(a,b)=>({s:atMin(day,a),e:atMin(day,b)});
  switch(kind){
    case 'private':return (hol&&!hwork)||off?[W(540,1260)]:[W(Math.max(we,hm2min('18:00')),1320)];
    case 'line':case 'stop':
      if(off)return [];
      if(hol)return [W(ws,we)];
      return st.lineRule?st.breaks.map(b=>W(hm2min(b.s),hm2min(b.e))):[W(ws,we)];
    case 'holiday':return hol&&!off?[W(ws,we)]:[];
    default:return off||(hol&&!hwork)?[]:[W(ws,we)];
  }
}
function windowRuleText(kind){
  const st=S.settings, br=st.breaks.map(b=>`${b.s}–${b.e}`).join('、')||'なし';
  if((kind==='line'||kind==='stop')&&st.lineRule)return `${KINDS[kind].label}は製造部門の休憩中（${br}）か休日に行う設定です`;
  if(kind==='holiday')return '休日作業は休日の勤務時間帯に置く設定です';
  return `勤務時間（${st.workStart}–${st.workEnd}）の外です`;
}
function busyList(excludeIds=new Set(),overrides=new Map(),extra=[],self=null){
  const out=[];
  for(const t of S.tasks.values()){
    if(t.id===self||t.status==='done'||t.milestone)continue;
    const ov=overrides.get(t.id);
    if(excludeIds.has(t.id)&&!ov)continue;
    const o=ov||t;
    if(o.end-o.start>DAY||!singleDay(o.start,o.end))continue;
    out.push({s:o.start,e:o.end,id:t.id,name:t.name});
  }
  for(const [id,o] of overrides)if(!S.tasks.has(id)&&id!==self)out.push({s:o.start,e:o.end,id,name:o.name});
  return out.concat(extra);
}
function findSlots(durMin,kind,from,to,opt={}){
  const dur=Math.max(5,durMin)*MIN, count=opt.count||3, step=15*MIN;
  const busy=busyList(opt.exclude||new Set(),opt.overrides||new Map(),opt.extra||[],opt.self||null);
  const res=[]; from=Math.max(from,ceilTo(Date.now(),5*MIN)); if(!to||to<=from)to=addDays(from,21);
  for(let day=sod(from),n=0;day<to&&res.length<count&&n<120;day=addDays(day,1),n++){
    for(const w of allowedWindows(kind,day)){
      let s=Math.max(w.s,from); s=ceilTo(s,step); if(s<w.s)s=w.s;
      const bs=busy.filter(b=>b.e>w.s&&b.s<w.e).sort((a,b)=>a.s-b.s);
      while(s+dur<=w.e&&res.length<count){
        const hit=bs.find(b=>b.s<s+dur&&b.e>s);
        if(!hit){res.push({start:s,end:s+dur});s=s+dur;break}
        s=ceilTo(hit.e,step);
      }
    }
  }
  return res;
}
function validatePlacement(task,start,end,opt={}){
  const blocking=[],warnings=[],now=Date.now();
  if(!(end>start))blocking.push('終了が開始より前です');
  if(singleDay(start,end)&&task.kind!=='private'){
    const wins=allowedWindows(task.kind,sod(start));
    const fits=wins.some(w=>start>=w.s&&end<=w.e);
    if(!fits){
      if(['line','stop','holiday'].includes(task.kind))blocking.push(windowRuleText(task.kind));
      else if(isHoliday(start))warnings.push('休日です');
      else warnings.push('勤務時間外（残業）にかかります');
    }
  }
  for(const pid of task.deps||[]){
    const p=(opt.overrides&&opt.overrides.get(pid))||S.tasks.get(pid);
    if(p&&p.end>start)warnings.push(`前工程「${(S.tasks.get(pid)||p).name}」の終了（${fMD(p.end)} ${fHM(p.end)}）より前です`);
  }
  if(task.deadline&&end>task.deadline)warnings.push(`期限 ${fMDW(task.deadline)} ${fHM(task.deadline)} を過ぎます`);
  if(opt.checkOverlap&&singleDay(start,end)){
    const hit=busyList(new Set(opt.exclude||[]),opt.overrides||new Map(),opt.extra||[],task.id).find(b=>b.s<end&&b.e>start);
    if(hit)(opt.overlapIsError?blocking:warnings).push(`「${hit.name||'別の提案'}」（${fHM(hit.s)}–${fHM(hit.e)}）と重なります`);
  }
  if(opt.noPast&&start<now-5*MIN)blocking.push('過去の時刻です');
  return {blocking,warnings};
}
function cascade(rootId,root){
  const overrides=new Map([[rootId,root]]), moves=[], queue=[rootId], seen=new Set([rootId]);
  let guard=0;
  while(queue.length&&guard++<300){
    const pid=queue.shift(), p=overrides.get(pid)||S.tasks.get(pid);
    const succ=[...S.tasks.values()].filter(t=>t.deps.includes(pid)&&t.status!=='done').sort((a,b)=>a.start-b.start);
    for(const t of succ){
      const cur=overrides.get(t.id)||t;
      if(cur.start>=p.end)continue;
      const dur=cur.end-cur.start;
      let nv=null;
      if(dur<=DAY&&singleDay(cur.start,cur.end)){
        const sl=findSlots(dur/MIN,t.kind,p.end,addDays(p.end,30),{count:1,self:t.id,overrides})[0];
        if(sl)nv=sl;
      }
      if(!nv)nv={start:p.end,end:p.end+dur};
      overrides.set(t.id,nv);
      moves.push({id:t.id,name:t.name,from:{start:cur.start,end:cur.end},to:nv,deadlineMiss:!!(t.deadline&&nv.end>t.deadline),deadline:t.deadline});
      if(!seen.has(t.id)){seen.add(t.id);queue.push(t.id)}
    }
  }
  return moves;
}
function overlapIds(list){
  const ids=new Set(), xs=list.filter(t=>!t.ghost&&t.status!=='done'&&!t.milestone&&singleDay(t.start,t.end)).sort((a,b)=>a.start-b.start);
  for(let i=0;i<xs.length;i++)for(let j=i+1;j<xs.length&&xs[j].start<xs[i].end;j++){
    if((xs[i].kind==='private')!==(xs[j].kind==='private'))continue;
    ids.add(xs[i].id);ids.add(xs[j].id);
  }
  return ids;
}

/* ============ persistence: local cache + claude.ai shared store ============ */
let cacheTimer=null;
function cacheLocal(){clearTimeout(cacheTimer);cacheTimer=setTimeout(()=>{
  LS.set('tasks',[...S.tasks.values()]);LS.set('proposals',[...S.proposals.values()].slice(-40));
  LS.set('settings',S.settings);LS.set('attendance',S.attendance);
},150)}
function setSync(st){S.sync=st;const d=$('#syncDot');if(d)d.className='sync '+st}
const Store={
  db:null, q:new Map(), loaded:false,
  async init(){
    for(const o of LS.get('tasks',[])){const t=normTask(o);S.tasks.set(t.id,t)}
    for(const p of LS.get('proposals',[]))if(p&&p.id)S.proposals.set(p.id,p);
    S.settings={...clone(DEFAULT_SETTINGS),...LS.get('settings',{})};
    S.attendance=LS.get('attendance',{});
    render();
    if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return}
    let db=null;try{db=await window.claude.use('db')}catch{}
    if(!db){setSync('local');return}
    this.db=db;S.mode='cloud';setSync('saving');
    const timer=setTimeout(()=>{if(!this.loaded){setSync('error');toast('クラウドにまだ接続できません。この端末の内容を表示しています')}},10000);
    db.collection('tasks').onSnapshot(snap=>{
      if(snap.metadata.fromCache&&snap.empty&&!this.loaded)return;
      const m=new Map();for(const d of snap.docs){const t=normTask(d.data());m.set(t.id,t)}
      if(!snap.metadata.fromCache){clearTimeout(timer);if(!this.loaded){this.loaded=true;this.migrate(m)}}
      applyRemoteTasks(m);
      if(!this.q.size)setSync(snap.metadata.hasPendingWrites?'saving':'saved');
    },err=>{clearTimeout(timer);this.fail(err)});
    db.collection('proposals').onSnapshot(snap=>{
      const m=new Map();for(const d of snap.docs){const p=d.data();if(p&&p.id)m.set(p.id,p)}
      for(const [id,p] of S.proposals)if(S.dirty.has('p:'+id))m.set(id,p);
      S.proposals=m;cacheLocal();render();if(Pop.kind==='muse')renderMuse();
    },()=>{});
    db.doc('meta/settings').onSnapshot(snap=>{
      if(snap.exists&&!S.dirty.has('settings')){S.settings={...clone(DEFAULT_SETTINGS),...snap.data()};cacheLocal();render();if(Pop.kind==='settings')openSettings(true)}
    },()=>{});
    db.collection('attendance').onSnapshot(snap=>{
      for(const d of snap.docs)if(!S.dirty.has('att:'+d.id))S.attendance[d.id]=d.data().days||{};
      cacheLocal();if(Pop.kind==='stats')openStats(true);
    },()=>{});
  },
  migrate(remote){
    for(const t of S.tasks.values())if(t.pendingSync&&!remote.has(t.id)){remote.set(t.id,t);this.saveTask(t)}
  },
  fail(err){
    setSync('error');
    if(err&&err.code==='revoked'){this.db=null;S.mode='local'}
    toast('クラウドに保存できませんでした。この端末には保存されています');
  },
  enqueue(key,fn){
    const e=this.q.get(key)||{busy:false,next:null};e.next=fn;this.q.set(key,e);
    if(!e.busy)this.pump(key);
  },
  async pump(key){
    const e=this.q.get(key);
    if(!e||!e.next){this.q.delete(key);S.dirty.delete(key);if(!this.q.size&&S.sync!=='error')setSync('saved');return}
    const fn=e.next;e.next=null;e.busy=true;setSync('saving');
    try{await fn()}catch(err){
      if(err&&err.code==='unavailable'){await sleep(400+Math.random()*700);try{await fn()}catch(e2){this.fail(e2)}}
      else this.fail(err);
    }
    e.busy=false;this.pump(key);
  },
  saveTask(t){
    cacheLocal();
    if(!this.db){t.pendingSync=true;setSync('local');return}
    const data=JSON.parse(JSON.stringify({...t,pendingSync:false}));
    S.dirty.set(t.id,true);this.enqueue(t.id,()=>this.db.doc('tasks/'+t.id).set(data));
  },
  deleteTask(id){
    S.tasks.delete(id);cacheLocal();
    if(this.db){S.dirty.set(id,'del');this.enqueue(id,()=>this.db.doc('tasks/'+id).delete())}
  },
  saveProposal(p){
    cacheLocal();if(!this.db)return;
    const k='p:'+p.id;S.dirty.set(k,true);const data=clone(p);
    this.enqueue(k,()=>this.db.doc('proposals/'+p.id).set(data));
  },
  deleteProposal(id){if(this.db){const k='p:'+id;S.dirty.set(k,true);this.enqueue(k,()=>this.db.doc('proposals/'+id).delete())}},
  saveSettings(){
    cacheLocal();if(!this.db)return;
    S.dirty.set('settings',true);const data=clone(S.settings);
    this.enqueue('settings',()=>this.db.doc('meta/settings').set(data));
  },
  saveAttendance(mk){
    cacheLocal();if(!this.db)return;
    const k='att:'+mk;S.dirty.set(k,true);const data={days:clone(S.attendance[mk]||{})};
    this.enqueue(k,()=>this.db.doc('attendance/'+mk).set(data));
  }
};
let pendingRemote=null;
function applyRemoteTasks(m){
  if(G.mode==='drag'){pendingRemote=m;return}
  for(const [id,flag] of S.dirty){
    if(id.includes(':')||id==='settings')continue;
    if(flag==='del')m.delete(id);else if(S.tasks.has(id))m.set(id,S.tasks.get(id));
  }
  S.tasks=m;cacheLocal();render();
  if(Pop.kind==='detail'){if(S.tasks.has(S.selected))refreshDetail();else closePop()}
  else if(Pop.kind==='list')openList(true);
}

/* ============ mutations ============ */
function commit(id,patch,meta={}){
  const cur=S.tasks.get(id), isNew=!cur;
  const next=normTask({...(cur||{}),...patch,id});
  const before={},after={};
  for(const k of TRACKED)if(JSON.stringify(cur?cur[k]:undefined)!==JSON.stringify(next[k])){before[k]=cur?cur[k]:null;after[k]=next[k]}
  const segsChanged=JSON.stringify(cur?cur.segs:[])!==JSON.stringify(next.segs);
  if(!isNew&&!Object.keys(after).length&&!segsChanged)return cur;
  next.history=[...(cur?cur.history:[]),{at:Date.now(),by:meta.by||'user',action:meta.action||(isNew?'作成':'変更'),reason:meta.reason||'',before:isNew?null:before,after:isNew?null:after}].slice(-40);
  next.updatedAt=Date.now();next.rev=(cur?cur.rev:0)+1;
  S.tasks.set(id,next);Store.saveTask(next);
  return next;
}
function removeTask(id,meta={}){
  const t=S.tasks.get(id);if(!t)return;
  for(const o of S.tasks.values())if(o.deps.includes(id))commit(o.id,{deps:o.deps.filter(d=>d!==id)},{by:meta.by,action:'前工程の削除に伴い依存を解除'});
  Store.deleteTask(id);
  if(S.selected===id)S.selected=null;
}
function snapshotFor(ids){return ids.map(id=>({id,prev:S.tasks.has(id)?clone(S.tasks.get(id)):null}))}
function doUndo(){
  const u=S.undo;if(!u)return;S.undo=null;
  for(const it of u.items.slice().reverse()){
    if(!it.prev){if(S.tasks.has(it.id))Store.deleteTask(it.id)}
    else{const p=it.prev;const f={};for(const k of [...TRACKED,'segs'])f[k]=p[k];commit(it.id,f,{action:'元に戻す'})}
  }
  render();refreshAnyPop();toast('元に戻しました');
}
function setStatus(id,action,by='user'){
  const t=S.tasks.get(id);if(!t)return;
  const now=Date.now(), segs=t.segs.map(s=>({...s}));
  const close=()=>{const o=segs[segs.length-1];if(o&&!o.e)o.e=now};
  let patch={};
  if(action==='start'||action==='resume'){close();segs.push({s:now,e:null});patch={status:'doing'}}
  else if(action==='pause'){close();patch={status:'paused'}}
  else if(action==='done'){close();patch={status:'done',progress:100}}
  else if(action==='reopen'){patch={status:segs.length?'paused':'todo',progress:Math.min(t.progress,90)}}
  patch.segs=segs;
  S.undo={items:snapshotFor([id])};
  commit(id,patch,{by,action:{start:'開始',resume:'再開',pause:'中断',done:'完了',reopen:'未完了に戻す'}[action]});
}
async function applyTimeChange(id,start,end,how='日時変更',by='user'){
  const t=S.tasks.get(id);if(!t)return;
  if(start===t.start&&end===t.end){render();return}
  const v=validatePlacement(t,start,end);
  if(v.blocking.length){
    const ok=await ask(v.blocking.join('\n')+'\n\nこのまま変更しますか？','このまま変更','やめる');
    if(!ok){render();refreshAnyPop();return}
  }
  const moves=cascade(id,{start,end});
  S.undo={items:snapshotFor([id])};
  commit(id,{start,end},{by,action:how});
  render();refreshAnyPop();
  if(moves.length){
    const miss=moves.filter(m=>m.deadlineMiss).length;
    toast(`後続${moves.length}件と重なります${miss?`（期限超過${miss}件）`:''}`,'後続を調整',()=>{
      S.undo={items:snapshotFor([id,...moves.map(m=>m.id)])};
      for(const m of moves)commit(m.id,{start:m.to.start,end:m.to.end},{by,action:'後続を自動調整',reason:`「${t.name}」の変更に追従`});
      render();refreshAnyPop();toast(`後続${moves.length}件を作業可能な時間帯へ移しました`,'元に戻す',doUndo);
    },7000);
  }else{
    const w=v.warnings[0];
    toast(w?`変更しました・${w}`:`${singleDay(start,end)?`${fMDW(start)} ${fHM(start)}–${fHM(end)}`:`${fMD(start)} ${fHM(start)} → ${fMD(end)} ${fHM(end)}`} に変更`,'元に戻す',doUndo);
  }
}

/* ============ axis & coordinates ============ */
let AX=null;
const scroller=$('#scroller'), grid=$('#grid'), touchHold=$('#touchHold');
function yearStartOf(t){const ys=clamp(+S.settings.yearStart||4,1,12),d=new Date(t);let y=d.getFullYear();if(d.getMonth()+1<ys)y--;return new Date(y,ys-1,1).getTime()}
function rangeOfView(){
  const v=S.view;let days=[];
  if(v==='day')days=[S.anchor];
  else if(v==='week'){const m=monday(S.anchor);for(let i=0;i<7;i++)days.push(addDays(m,i))}
  else if(v==='month'){const d=new Date(S.anchor);const f=new Date(d.getFullYear(),d.getMonth(),1).getTime();const n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();for(let i=0;i<n;i++)days.push(addDays(f,i))}
  else{
    // 大日程: one year from the configured start month (年度 = April by default), by week or by month
    const ys=yearStartOf(S.anchor),ye=new Date(new Date(ys).getFullYear()+1,new Date(ys).getMonth(),1).getTime();
    if(S.mscale==='month'){for(let i=0;i<12;i++){const d=new Date(ys);days.push(new Date(d.getFullYear(),d.getMonth()+i,1).getTime())}return {days,from:ys,to:ye}}
    for(let w=monday(ys);w<ye;w=addDays(w,7))days.push(w);
    return {days,from:days[0],to:addDays(days[days.length-1],7)};
  }
  return {days,from:days[0],to:addDays(days[days.length-1],1)};
}
function computeAxis(tasks){
  const {days,from,to}=rangeOfView(), v=S.view;
  const ws=hm2min(S.settings.workStart), we=hm2min(S.settings.workEnd);
  let lo=0,hi=1440,segs;
  if(v==='day'){
    // DAY: 6:00–20:00, widened only when a task sits outside it; outside working hours is shaded
    lo=Math.min(ws,360);hi=Math.max(we,1200);
    for(const t of tasks){if(!singleDay(t.start,t.end)||t.start<from||t.end>to)continue;const ds=sod(t.start);lo=Math.min(lo,(t.start-ds)/MIN);hi=Math.max(hi,(t.end-ds)/MIN)}
    lo=Math.max(0,Math.floor(lo/30)*30);hi=Math.min(1440,Math.ceil(hi/30)*30);if(hi<=lo)hi=lo+60;
    segs=[{d:days[0],s:atMin(days[0],lo),e:atMin(days[0],hi)}];
  }else if(v==='master')segs=S.mscale==='month'?days.map((d,i)=>({d,s:d,e:days[i+1]||to})):days.map(d=>({d,s:d,e:addDays(d,7)}));  // one column = one month / one week
  else segs=days.map(d=>({d,s:d,e:addDays(d,1)}));                     // one column = one day
  const avail=Math.max(160,scroller.clientWidth-S.nw);
  // a month by day and a year by week get a readable column width and scroll sideways inside the chart (names stay put)
  const minCol=0;
  const trackW=Math.floor(Math.max(avail,segs.length*minCol)*S.zoom), segW=trackW/segs.length, pxH=v==='day'?segW/((hi-lo)/60):0;
  const unit=v==='day'?(pxH>=100?15:pxH>=50?30:60):0;
  const snap=v==='day'?(pxH>=240?5:pxH>=20?15:30):0;
  AX={v,days,segs,from,to,lo,hi,trackW,segW,pxH,unit,snap,ws,we,cell:v!=='day',ms:S.mscale,ppd:v==='master'?(S.mscale==='week'?segW/7:segW/30.44):segW};
  return AX;
}
function X(t){
  const {segs,segW,trackW}=AX;
  if(t<=segs[0].s)return 0;
  for(let i=0;i<segs.length;i++){const g=segs[i];if(t<g.s)return i*segW;if(t<=g.e)return i*segW+(t-g.s)/(g.e-g.s)*segW}
  return trackW;
}
function T(x){
  const {segs,segW}=AX;const i=clamp(Math.floor(x/segW),0,segs.length-1);
  const f=clamp((x-i*segW)/segW,0,1),g=segs[i];return g.s+f*(g.e-g.s);
}
function snapT(t){if(AX.cell)return t;const u=AX.snap*MIN,d=sod(t);return d+Math.round((t-d)/u)*u}
function inSeg(t){return AX.segs.some(g=>t>=g.s&&t<=g.e)}
// pixel span of a task: exact times in DAY, whole day / whole week cells otherwise
function spanOf(t){
  const a0=AX.segs[0].s,z=AX.segs[AX.segs.length-1].e;
  let a=t.start,b=t.end,inset=0;
  if(AX.v==='master'){if(AX.ms==='week'&&isMaster(t)){a=monday(t.start);b=addDays(monday(t.end-1),7);inset=2}}
  else if(AX.cell){a=sod(t.start);b=addDays(sod(t.end-1),1);inset=2}
  return {l:X(Math.max(a,a0))+inset,r:X(Math.min(b,z))-inset};
}
/* ============ render chart ============ */
const viewOk=t=>S.view==='master'?(isMaster(t)||t.milestone||S.showDaily):S.view==='day'?!isMaster(t):true;
function visibleTasks(){
  const {from,to}=rangeOfView();
  return [...S.tasks.values()].filter(t=>t.status!=='done'&&scopeOk(t)&&viewOk(t)&&t.end>from&&t.start<to);
}
function ghostData(){
  const creates=[],moves=new Map();
  for(const p of S.proposals.values()){
    if(p.status!=='pending')continue;
    p.ops.forEach((o,i)=>{
      if(o.op==='create')creates.push(normTask({...o,id:'g-'+p.id+'-'+i,status:'todo',progress:0,history:[]}));
      else if(o.op==='move'&&S.tasks.has(o.task_id))moves.set(o.task_id,{start:o.start,end:o.end,pid:p.id});
    });
  }
  creates.forEach(c=>{c.ghost=true;c.pid=c.id.split('-')[1]});
  return {creates,moves};
}

function rowHTML(t,now,conflicts,ghostMove){
  const st=barState(t,now), sel=S.selected===t.id&&!t.ghost;
  let inner='';
  const {from,to}=rangeOfView();
  if(t.end>from&&t.start<to)inner+=barHTML(t,st,sel);
  if(ghostMove)inner+=barHTML({...t,start:ghostMove.start,end:ghostMove.end,ghost:true,pid:ghostMove.pid},'ghost',false);
  if(!t.ghost){
    if(AX.v==='day')for(const s of t.segs){const a=Math.max(s.s,AX.segs[0].s),b=Math.min(s.e||now,AX.segs[AX.segs.length-1].e);if(b<=a)continue;const l=X(a),r=X(b);inner+=`<i class="act${s.e?'':' live'}" style="left:${l.toFixed(1)}px;width:${Math.max(3,r-l).toFixed(1)}px"></i>`}
    if(t.deadline&&t.deadline>=AX.segs[0].s&&t.deadline<=AX.segs[AX.segs.length-1].e){
      const x=AX.v==='master'?(AX.ms==='week'?X(addDays(monday(t.deadline),7))-1:X(t.deadline)):AX.cell?X(addDays(sod(t.deadline),1))-1:X(t.deadline);
      inner+=`<i class="dl" style="left:${x.toFixed(1)}px"></i>`;
    }
  }
  let meta=rangeText(t),mc='';
  if(t.ghost){meta='提案 · '+meta;mc='gh'}
  else if(t.status==='done')meta='完了 · '+meta;
  else if(isLate(t,now)){meta=(now>t.end?'遅延 ':'期限超過 ')+(AX.v==='day'||isMaster(t)?meta:fMD(t.start));mc='late'}
  else if(t.status==='doing'){meta='作業中 · '+meta;mc='run'}
  else if(conflicts.has(t.id)){meta='重複 · '+meta;mc='warn'}
  const ck=t.ghost?`<span class="ck gh" aria-hidden="true">✦</span>`:`<span class="ck s-${t.status}${isLate(t,now)?' late':''}${isMaster(t)?' mst':''}" data-ck="${t.id}" role="button" tabindex="0" aria-label="${t.status==='done'?'未完了に戻す':'完了にする'}">${ICON.check}</span>`;

function barHTML(t,st,sel){

function rangeText(t){
  if(isMaster(t))return masterRange(t);
  const same=singleDay(t.start,t.end);
  if(t.milestone)return fMD(t.end)+' '+fHM(t.end);
  if(AX&&AX.v==='day'&&same)return `${fHM(t.start)}–${fHM(t.end)}`;
  if(same)return `${fMD(t.start)} ${fHM(t.start)}`;
  return `${fMD(t.start)}–${fMD(t.end-1)}`;
}
function drawDeps(){

  const t=S.tasks.get(S.selected);if(!t){svg.innerHTML='';return}
  const rowY=id=>{const r=body.querySelector(`[data-row="${CSS.escape(id)}"]`);return r?r.offsetTop+20:null};
  const pairs=[];
  for(const p of t.deps)if(S.tasks.has(p))pairs.push([S.tasks.get(p),t]);
  for(const s of S.tasks.values())if(s.deps.includes(t.id))pairs.push([t,s]);
  let d='';
  for(const [a,b] of pairs){
    const y1=rowY(a.id),y2=rowY(b.id);if(y1==null||y2==null)continue;
    const x1=spanOf(a).r,x2=spanOf(b).l,mx=Math.max(x1+8,Math.min(x2-8,x1+14));
    d+=`<path d="M${x1} ${y1}H${mx}V${y2}H${x2}"/>`;

}

/* ============ gestures: tap / long-press drag / handle resize / pinch ============ */
const G={mode:null,lp:null,x0:0,y0:0,target:null,lastTouch:0,moved:false,touchEls:new Set()};
const tip=$('#tip');
function trackX(clientX){const r=scroller.getBoundingClientRect();return clientX-r.left+scroller.scrollLeft-S.nw}
function down(x,y,target){
  G.x0=x;G.y0=y;G.target=target;G.moved=false;G.mode='pending';clearTimeout(G.lp);
  const hd=target.closest('.hd');
  if(hd){const bar=hd.closest('.bar');startDrag(hd.dataset.side,bar.dataset.id,bar,x,y);return true}
  const bar=target.closest('.bar[data-id],.ms[data-id]');
  if(bar){G.lp=setTimeout(()=>startDrag('move',bar.dataset.id,bar,G.x0,G.y0),300);return false}
  // long-press on any empty part of the chart adds there (in that row's project when pressed on a row or group)
  if(target.closest('#cbody')&&!target.closest('.nm,.gn')&&trackX(x)>=0){G.lp=setTimeout(()=>{G.mode='held';const t=T(clamp(trackX(G.x0),0,AX.trackW-1));
    const row=target.closest('.row'),grp=target.closest('.grp'),project=grp?grp.dataset.grp:row&&S.tasks.has(row.dataset.row)?S.tasks.get(row.dataset.row).project:null;
    if(AX.v==='master')openAdd({mode:'master',week:monday(t),project});else if(AX.cell)openAdd({day:sod(t),project});else openAdd({start:snapT(t),project})},550)}
  return false;
}
function startDrag(type,id,el,x,y){
  const t=S.tasks.get(id);if(!t)return;
  G.mode='drag';G.drag={type,id,el,cx0:trackX(x),t0:{start:t.start,end:t.end},cur:{start:t.start,end:t.end},task:t};
  if(S.selected!==id){S.selected=id;document.querySelectorAll('.bar.sel,.row.sel').forEach(e=>e.classList.remove('sel'))}
  el.classList.add('lift');showTip(x,y);
}
function moveDrag(x,y){
  const d=G.drag;if(!d)return;
  const dx=trackX(x)-d.cx0, {start,end}=d.t0, dur=end-start;
  let s=start,e=end;
  if(AX.cell){
    // week / month / 大日程: move and stretch by whole days (or whole weeks), keeping the time of day
    // 大日程 items always move by whole weeks; everything else by whole days
    let k=Math.round(dx/AX.ppd);if(isMaster(d.task))k=Math.round(k/7)*7;const min=isMaster(d.task)?7*DAY:15*MIN;
    if(d.type==='move'){s=addDays(start,k);e=addDays(end,k)}
    else if(d.type==='l'){s=addDays(start,k);if(e-s<min)s=d.cur.start}
    else{e=addDays(end,k);if(e-s<min)e=d.cur.end}
  }else{
    if(d.type==='move'){s=snapT(T(X(start)+dx));e=s+dur}
    else if(d.type==='l')s=Math.min(snapT(T(X(start)+dx)),end-AX.snap*MIN);
    else e=Math.max(snapT(T(X(end)+dx)),start+AX.snap*MIN);
  }
  d.cur={start:s,end:e};
  if(d.el.classList.contains('ms')){const x=AX.cell?(()=>{const sp=spanOf({start:e-1,end:e});return (sp.l+sp.r)/2})():X(e);d.el.style.left=x+'px'}
  else{const sp=spanOf({...d.task,start:s,end:e});d.el.style.left=sp.l+'px';d.el.style.width=Math.max(6,sp.r-sp.l)+'px'}
  showTip(x,y);
  // edge auto-scroll when zoomed
  const rc=scroller.getBoundingClientRect();
  if(scroller.scrollWidth>scroller.clientWidth){if(x>rc.right-28)scroller.scrollLeft+=8;else if(x<rc.left+S.nw+20)scroller.scrollLeft-=8}
}
function showTip(x,y){

  const v=validatePlacement(d.task,start,end);

  tip.className='tip'+(v.blocking.length?' warn':'');tip.style.display='block';
  const hb=$('.top').getBoundingClientRect();tip.style.left=(innerWidth/2)+'px';tip.style.top=(hb.top+hb.height/2)+'px';

function endDrag(){

function up(){

function tap(target){

    select(id);return}

// pinch
function pinchStart(e){
  clearTimeout(G.lp);if(G.mode==='drag'){endDrag()}
  const [a,b]=e.touches;G.mode='pinch';
  G.p={d0:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),z0:S.zoom,cx:(a.clientX+b.clientX)/2};
  G.p.t=T(clamp(trackX(G.p.cx),0,AX.trackW));
}
let pinchRAF=0;
function pinchMove(e){
  const [a,b]=e.touches;const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  G.p.z=clamp(G.p.z0*d/G.p.d0,1,AX.v==='day'?8:6);
  if(pinchRAF)return;
  // apply the latest finger distance on the next frame (not the one that scheduled it)
  pinchRAF=requestAnimationFrame(()=>{pinchRAF=0;if(G.p)zoomTo(G.p.z,G.p.t,G.p.cx)});

function pinchEnd(){if(pinchRAF){cancelAnimationFrame(pinchRAF);pinchRAF=0}if(G.p&&G.p.z)zoomTo(G.p.z,G.p.t,G.p.cx)}
function zoomTo(z,anchorT,clientX){

scroller.addEventListener('touchstart',e=>{
  G.lastTouch=Date.now();for(const t of e.changedTouches)G.touchEls.add(t.target);

  if(e.touches.length>2)return;
  const t=e.touches[0];if(down(t.clientX,t.clientY,e.target))e.preventDefault();
},{passive:false});
scroller.addEventListener('touchmove',e=>{
  if(G.mode==='pinch'&&e.touches.length===2){e.preventDefault();pinchMove(e);return}
  const t=e.touches[0];if(!t)return;
  G.lx=t.clientX;G.ly=t.clientY;
  if(G.mode==='drag'){e.preventDefault();moveDrag(t.clientX,t.clientY);return}
  // a sideways swipe past the chart's end must not drag the page (or the app around it) away
  if(e.cancelable&&(G.mode==='pending'||G.mode==='scroll')){const dx=t.clientX-G.x0,dy=t.clientY-G.y0;if(Math.abs(dx)>Math.abs(dy)){const max=scroller.scrollWidth-scroller.clientWidth;if((dx<0&&scroller.scrollLeft>=max-1)||(dx>0&&scroller.scrollLeft<=0))e.preventDefault()}}
  if(Math.hypot(t.clientX-G.x0,t.clientY-G.y0)>8){G.moved=true;clearTimeout(G.lp);if(G.mode==='pending')G.mode='scroll'}
},{passive:false});
const releaseTouches=e=>{if(e.touches.length)return;G.touchEls.clear();if(touchHold.firstChild)setTimeout(()=>{if(!G.touchEls.size)touchHold.replaceChildren()},0)};
scroller.addEventListener('touchend',e=>{
  G.lastTouch=Date.now();setTimeout(()=>releaseTouches(e),0);

},{passive:false});
scroller.addEventListener('touchcancel',e=>{releaseTouches(e);clearTimeout(G.lp);if(G.mode==='drag'){endDrag()}G.mode=null});
scroller.addEventListener('mousedown',e=>{if(Date.now()-G.lastTouch<800||e.button!==0)return;G.ptr='mouse';if(down(e.clientX,e.clientY,e.target))e.preventDefault()});
window.addEventListener('mousemove',e=>{
  if(G.ptr!=='mouse')return;

  const g=G.edge;G.edge=null;if(!g)return;const t=e.changedTouches[0];

function select(id){S.selected=id;render();openDetail(id);ensureVisible(id)}
function ensureVisible(id){
  requestAnimationFrame(()=>{
    const row=grid.querySelector(`[data-row="${CSS.escape(id)}"]`);if(!row)return;
    const r=row.getBoundingClientRect(),sr=scroller.getBoundingClientRect();
    if(r.bottom>sr.bottom-4)scroller.scrollTop+=r.bottom-sr.bottom+12;else if(r.top<sr.top+36)scroller.scrollTop-=sr.top+36-r.top;
    const t=S.tasks.get(id);if(t&&scroller.scrollWidth>scroller.clientWidth){const x=spanOf(t).l+S.nw;const vis=scroller.scrollLeft+S.nw;if(x<vis||x>scroller.scrollLeft+scroller.clientWidth-40)scroller.scrollLeft=Math.max(0,x-S.nw-24)}
  });

function goToTask(id){
  const t=S.tasks.get(id);if(!t)return;
  if(isMaster(t)&&S.view==='day')S.view='week';
  if(!isMaster(t)&&!t.milestone&&S.view==='master')S.view='week';
  LS.set('view',S.view);
  const day=sod(Math.max(t.start,Math.min(Date.now(),t.end-1)));
  if(S.view==='day')S.anchor=sod(t.start)<=day&&day<t.end?day:sod(t.start);
  else S.anchor=sod(t.start);
  if(!scopeOk(t))S.scope='all';

function toggleDone(id){
  const t=S.tasks.get(id);if(!t)return;

  const row=!Pop.kind&&done&&grid.querySelector(`[data-row="${CSS.escape(id)}"]`);
  const fin=()=>{render();refreshAnyPop()};
  if(row&&row.animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches)row.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateX(24px)'}],{duration:200,easing:'ease-in',fill:'forwards'}).finished.then(fin,fin);else fin();
  toast(done?`「${t.name}」を完了 → 一覧の「完了」へ`:'未完了に戻しました・チャートに戻ります','元に戻す',doUndo);
}

function histHTML(t,limit=15){

function parseMaster(raw){

function parseQuick(raw,base=Date.now()){

  const today=sod(base);
  const dayFrom=(w)=>{
    if(!w)return null;
    if(/^今日/.test(w))return today; if(/^明日/.test(w))return addDays(today,1); if(/^(明後日|あさって)/.test(w))return addDays(today,2);
    let m=w.match(/^来週\s*([月火水木金土日])/);if(m)return addDays(monday(today),7+((DOW.indexOf(m[1])+6)%7));

    m=w.match(/^([月火水木金土日])/);if(m){const k=(DOW.indexOf(m[1])-new Date(today).getDay()+7)%7;return addDays(today,k)}

  ops.forEach(o=>{if((o.op==='move'||o.op==='delete')&&o.task_id)moving.add(String(o.task_id))});
  ops.forEach((o,i)=>{
    const op=String(o.op);

      const sc=o.scale==='week'?'week':'time';
      let s=parseDT(o.start),e=parseDT(o.end);if(!s||(!e&&sc!=='week')){errs.push(`#${i} create: start/end が必要です`);return}
      if(sc==='week'){s=monday(s);e=e?Math.max(addDays(s,7),addDays(monday(e-1),7)):addDays(s,7)}
      const tmp={id:'new:'+i,name:String(o.name||'無題'),kind:KINDS[o.kind]?o.kind:'desk',scale:sc,deps:(o.deps||[]).map(String),deadline:o.deadline?atMin(parseDT(o.deadline),hm2min(S.settings.workEnd)):null};

      v.blocking.forEach(m=>errs.push(`#${i}「${tmp.name}」: ${m}`));v.warnings.forEach(m=>warnings.push(`「${tmp.name}」: ${m}`));
      overrides.set('new:'+i,{start:s,end:e,name:tmp.name});

    }else if(op==='move'){
      const t=S.tasks.get(String(o.task_id));if(!t){errs.push(`#${i} move: task_id が見つかりません`);return}
      const s=parseDT(o.start),e=parseDT(o.end)||(s?s+(t.end-t.start):null);if(!s){errs.push(`#${i} move: start が必要です`);return}
      const v=validatePlacement(t,s,e,{checkOverlap:!o.allow_overlap,overlapIsError:true,overrides,exclude:moving,noPast:true});
      v.blocking.forEach(m=>errs.push(`#${i}「${t.name}」: ${m}`));v.warnings.forEach(m=>warnings.push(`「${t.name}」: ${m}`));
      overrides.set(t.id,{start:s,end:e,name:t.name});
      out.push({op,task_id:t.id,name:t.name,start:s,end:e,before:{start:t.start,end:t.end},rev:t.rev});
    }else if(op==='update'){
      const t=S.tasks.get(String(o.task_id));if(!t){errs.push(`#${i} update: task_id が見つかりません`);return}

    const sl=findSlots(remain,t.kind,now,addDays(now,21),{count:1,self:t.id,overrides,exclude})[0];
    if(!sl){skipped.push(t.name);continue}
    overrides.set(t.id,{start:sl.start,end:sl.end,name:t.name});moved.push(t.id);
    ops.push({op:'move',task_id:t.id,start:fISO(sl.start),end:fISO(sl.end)});

  const q=moved.slice();let guard=0;

    const pid=q.shift(),p=overrides.get(pid);
    for(const s of [...S.tasks.values()].filter(x=>x.deps.includes(pid)&&x.status!=='done').sort((a,b)=>a.start-b.start)){
      const cur=overrides.get(s.id)||s;if(cur.start>=p.end||!singleDay(cur.start,cur.end))continue;
      exclude.add(s.id);
      const sl=findSlots((cur.end-cur.start)/MIN,s.kind,p.end,addDays(p.end,21),{count:1,self:s.id,overrides,exclude})[0];
      if(!sl){skipped.push(s.name);continue}

  const part=late.filter(t=>t.progress>0&&moved.includes(t.id)).length;
  const reason=`遅延${moved.length}件を、作業可能条件（勤務時間・製造部門休憩・休日）と既存の予定を満たす直近の枠へ移します。`+(part?`途中まで進んだ${part}件は残りの作業時間で配置。`:'')+(ops.length>moved.length?`後続${ops.length-moved.length}件も前工程の後ろへずらします。`:'')+(skipped.length?`空きがない: ${skipped.join('、')}。`:'')+(longOnes.length?`複数日の遅延は対象外: ${longOnes.join('、')}。`:'');
  try{return {p:buildProposal({summary:`遅延${moved.length}件を再計画`,reason,ops})}}catch(e){return {err:String(e.message||e)}}
}

  Store.init();initMuse();scrollToFocus();markNav();
})();
